name: Ask for IT help
description: Describe a computer problem and I'll try to help.
title: "[IT HELP] "
labels: ["it-help"]
body:
  - type: markdown
    attributes:
      value: |
        **This page is public.** Anyone can read it. Never post passwords, 2FA codes, license keys, addresses or other personal info.
  - type: input
    id: device
    attributes:
      label: Device and system
      placeholder: e.g. Windows 11 laptop, MacBook with macOS 15, Ubuntu desktop
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's going wrong?
      description: What happens, what you expected, and when it started.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far?
      placeholder: Restarted, updated, searched the error message...
  - type: textarea
    id: errors
    attributes:
      label: Error messages
      description: Copy the exact text of any error, if there is one.
      render: text
