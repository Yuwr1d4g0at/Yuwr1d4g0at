name: Update pixel profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - data/**
      - scripts/**
      - fonts/**
      - .github/workflows/update-profile.yml
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  build:
    # Issue events only matter for guestbook signatures.
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[GUESTBOOK]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THANK_GUESTBOOK: "true"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update pixel profile"
          git pull --rebase origin main
          git push
